<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Grok Bot Glass</title>
<style>
  :root { color-scheme: dark; font-family: -apple-system, system-ui, sans-serif; }
  body { margin: 0; background: #0b0d0c; color: #e8f5ec; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size: 22px; margin: 0 0 4px; } p { color: #9fb5a8; line-height: 1.45; margin: 8px 0; }
  .card { background: #141816; border: 1px solid #22302a; border-radius: 14px; padding: 16px; margin-top: 16px; }
  input { width: 100%; box-sizing: border-box; font-size: 28px; letter-spacing: 6px; text-align: center; padding: 12px; border-radius: 10px; border: 1px solid #2f4a3c; background: #0b0d0c; color: #e8f5ec; }
  button { width: 100%; margin-top: 12px; font-size: 17px; padding: 14px; border-radius: 10px; border: 0; background: #3ddc84; color: #04120a; font-weight: 600; }
  button.ghost { background: transparent; color: #9fb5a8; border: 1px solid #2f4a3c; }
  #status { min-height: 1.4em; } .hidden { display: none; }
</style>
</head>
<body>
  <h1>Grok Bot Glass</h1>
  <p>Talk to your Grok Bots from your G2. Approvals stay in the Grok Bot app.</p>
  <div class="card" id="pairCard">
    <p>Enter the 8-digit code Shuri gave you. It works once and expires in 10 minutes.</p>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="00000000" />
    <button id="pairBtn">Pair glasses</button>
  </div>
  <div class="card hidden" id="pairedCard">
    <p><strong>Paired.</strong> Look at your glasses. Press to open a bot, long press to talk.</p>
    <button class="ghost" id="unpairBtn">Unpair this phone</button>
  </div>
  <p id="status" role="status"></p>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
